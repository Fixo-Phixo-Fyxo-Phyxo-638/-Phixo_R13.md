```yaml
name: Run Jest tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm test -- --detectOpenHandles --forceExit --passWithNoTests
```

Si usas Yarn:

```yaml
      - run: yarn install --frozen-lockfile
