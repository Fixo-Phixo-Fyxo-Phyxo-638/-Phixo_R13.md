🏗️ 3. WORKFLOWS DE CI/CD

📁 .github/workflows/lint.yml

```yaml
name: Lint Code Base

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: super-linter/super-linter@v6
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          LINTER_RULES_PATH: .github/linters
          FILTER_REGEX_EXCLUDE: '.*\.(png|jpg|jpeg|gif|svg)$'
```

📁 .github/workflows/test.yml

```yaml
name: Run Jest tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - run: corepack enable

      - name: Instalar dependencias
        run: |
          if [ -f yarn.lock ]; then
            yarn install --immutable
          else
            echo "::warning::yarn.lock missing"
            yarn install
          fi

      - run: yarn test --runInBand --detectOpenHandles --passWithNoTests
```

📁 .github/workflows/auto-label.yml

```yaml
name: Auto-label merge conflicts

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prince-chrismc/label-merge-conflicts-action@v3
        with:
          conflict_label_name: 'merge conflict'
          github_token: ${{ github.token }}
          detect_merge_changes: false
```

⚠️ Requisito previo: Crear la etiqueta merge conflict en Settings → Labels.

