Auto-label Merge Conflicts (repara el error de permisos)

```yaml
name: Auto-label merge conflicts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
